<body>
    <div>
        <div class="title hidden">Install Instruction</div>
        <div class="step"><strong>1.</strong> <strong>下载</strong>新显示 / <strong>打开</strong>保存的显示.</div>
        <img class="responsive-image" src="help-01.jpg">
        <div class="note">(选项下载取决于作者)</div>
        <div class="step"><strong>2.</strong> 点击<strong>安装</strong>按钮，<strong>Mi Fit</strong>应用将打开。 确保此应用和miband已连接。</div>
        <img class="responsive-image" src="help-02.jpg">
        <div class="step"><strong>3.</strong> 在底部导航中点击<strong>Profile</strong>。</div>
        <img class="responsive-image" src="help-03.jpg">
        <div class="step"><strong>4.</strong> 点击<strong>Mi Smart Band 4</strong>行。</div>
        <img class="responsive-image" src="help-04.jpg">
        <div class="step"><strong>5.</strong> 点击<strong>Band display settings</strong>行。</div>
        <img class="responsive-image" src="help-05.jpg">
        <div class="step"><strong>6a.</strong> 点击<strong>第三</strong>标签。 如果只有<strong><i>两个</i></strong>标签，请转到<strong><i>6b</i></strong>步骤。</div>
        <img class="responsive-image" src="help-06.jpg">
        <div class="step"><strong>6b.</strong> 点击<strong>第一个</strong>标签。</div>
        <img class="responsive-image" src="help-07.jpg">
        <div class="step"><strong>7.</strong> 选择<strong>指定的显示</strong>并<strong>同步</strong>。</div>
        <div id="author">made by 2U Software</div>
        <button id="btn_reload" class="hidden" onClick="reloadAndroidWebView()">Tải lại</button>
    </div>
